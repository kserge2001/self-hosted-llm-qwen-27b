# The gateway: LiteLLM. Every app calls Astra through it with its own team key.
# It checks the key, enforces the team's budget and rate limit, records the spend, then forwards to vLLM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: gateway
data:
  config.yaml: |
    model_list:
      # "astra" is the product name apps use. The model behind it can change without any app changing.
      - model_name: astra
        litellm_params:
          model: hosted_vllm/qwen3.8-27b
          api_base: http://vllm.llm.svc.cluster.local:8000/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300
          # Internal price per token (chargeback). The GPUs cost the same whether a team uses them or not,
          # so this price spreads that cost over the tokens the teams use. See docs/deployment-guide.md, step 11.
          input_cost_per_token: __INPUT_COST__
          output_cost_per_token: __OUTPUT_COST__
        model_info:
          description: Qwen3.8-27B (FP8) on vLLM, self-hosted on EKS

    router_settings:
      num_retries: 1
      # Shared counters, so rate limits and budgets are exact across both gateway replicas.
      redis_host: redis.gateway.svc.cluster.local
      redis_port: 6379

    litellm_settings:
      callbacks: ["prometheus"]          # spend and requests per team, scraped by Prometheus
      drop_params: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: gateway
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
      annotations:
        config-version: "1"                  # change it to restart the gateway after a config change
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.101.6
          args: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
          envFrom:
            - secretRef:
                name: litellm-env            # LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL, VLLM_API_KEY
          ports:
            - name: http
              containerPort: 4000
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness       # fails when the database is unreachable
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: gateway
  labels:
    app.kubernetes.io/name: litellm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: litellm
  namespace: gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  podMetricsEndpoints:
    - port: http
      path: /metrics/
      interval: 30s
      authorization:            # the gateway's /metrics needs a key; Prometheus uses the admin key
        type: Bearer
        credentials:
          name: litellm-env
          key: LITELLM_MASTER_KEY
---
# Shared counters for rate limits and budgets. In-cluster for the lab; ElastiCache is the managed option.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gateway
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
