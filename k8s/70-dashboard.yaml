# Grafana dashboard: GPU serving health and spend by team. Built by dashboards/build_dashboard.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: astra-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  astra.json: |
    {
      "title": "Astra: serving and team spend",
      "uid": "astra",
      "schemaVersion": 39,
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests running on the GPUs",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (vllm:num_requests_running)",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests waiting for a GPU",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (vllm:num_requests_waiting)",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "GPU memory for conversations (KV cache) used",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max by (pod) (vllm:kv_cache_usage_perc)",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Output tokens per second",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(vllm:generation_tokens_total[1m]))",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Time to first token, p95",
          "gridPos": {
            "x": 8,
            "y": 8,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Full answer time, p95",
          "gridPos": {
            "x": 16,
            "y": 8,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Spend by team, internal price (last 24h)",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (team_alias) (increase(litellm_spend_metric_total[24h]))",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Tokens by team (last 24h)",
          "gridPos": {
            "x": 8,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (team_alias) (increase(litellm_total_tokens_metric_total[24h]))",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Budget left by team",
          "gridPos": {
            "x": 16,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max by (team_alias) (litellm_remaining_team_budget_metric)",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Requests by team per minute",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (team_alias) (rate(litellm_proxy_total_requests_metric_total[5m])) * 60",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Failed requests by team per minute (budget, rate limit, errors)",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (team_alias) (rate(litellm_proxy_failed_requests_metric_total[5m])) * 60",
              "legendFormat": "{{team_alias}}{{pod}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
