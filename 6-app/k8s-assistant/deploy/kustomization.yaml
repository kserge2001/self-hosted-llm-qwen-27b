apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - externalsecret.yaml
  - deployment.yaml
images:
  # Deploying a new version = changing newTag in a pull request. CI prints the tag it pushed (sha-<commit>).
  # The repo owner from repo_url (1-foundations). A fork: put your GitHub user here, in lower case,
  # because CI pushes to ghcr.io/<repo owner>/k8s-assistant.
  - name: ghcr.io/kserge2001/k8s-assistant
    newName: ghcr.io/kserge2001/k8s-assistant
    newTag: sha-0000000
