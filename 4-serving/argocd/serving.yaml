# Stage 4: vLLM in namespace "serving". Apply once:  kubectl apply -f 4-serving/argocd/serving.yaml
# An ApplicationSet with the cluster generator makes one Application named "serving".
# It reads repo_url, repo_revision and aws_region from the cluster Secret that Terraform made (GitOps Bridge),
# so this file needs no editing.
# Canary for a model upgrade: copy this file as serving-canary.yaml with name "serving-canary",
# releaseName "vllm-canary", a values file with the new model.uri, and valuesObject "canary: true".
# The model pipeline (rollout canary) writes the values file; 7-operate/scripts/canary.sh start makes the copy. No change to the stable release: the GPU NodePool limit (4)
# fits 3 stable replicas + 1 canary.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: serving
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: serving
    spec:
      project: default
      source:
        repoURL: '{{ .metadata.annotations.repo_url }}'
        targetRevision: '{{ .metadata.annotations.repo_revision }}'
        path: 4-serving/charts/vllm
        helm:
          releaseName: vllm             # Service "vllm" -> vllm.serving.svc:8000
          valueFiles:
            - ../../values/qwen3.8-27b.yaml
          valuesObject:
            region: '{{ .metadata.annotations.aws_region }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: serving
      ignoreDifferences:
        # KEDA owns the replica count.
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
