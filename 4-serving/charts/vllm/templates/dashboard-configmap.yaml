{{- if and .Values.dashboard.enabled (not .Values.canary) }}
# Grafana dashboard: GPU serving health and spend by team (team panels read the gateway's metrics).
apiVersion: v1
kind: ConfigMap
metadata:
  name: astra-dashboard
  namespace: {{ .Values.dashboard.namespace }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  astra.json: |-
{{ .Files.Get "files/astra-dashboard.json" | indent 4 }}
{{- end }}
