# LiteLLM gateway: official chart oci://ghcr.io/berriai/litellm-helm 1.106.5 (latest stable, checked 2026-10-28).
# Every app calls Astra through it with its own team key. It checks the key, the team's budget and
# rate limit, masks personal data, records spend, then forwards to vLLM.
# Values that depend on the cluster (domain, certificate, guardrail id) come from argocd/gateway.yaml.

image:
  repository: ghcr.io/berriai/litellm
  tag: v1.106.5           # checked 2026-10-28; the chart default "Always" pull is not needed for a fixed tag
  pullPolicy: IfNotPresent

replicaCount: 2
numWorkers: 1

serviceAccount:
  create: true
  name: litellm           # EKS Pod Identity: bedrock:ApplyGuardrail on astra-guardrail

# Wave 2: start after the secrets (wave -1) and the database migration (wave 1).
deploymentAnnotations:
  argocd.argoproj.io/sync-wave: "2"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: litellm

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi           # the chart notes say about 4Gi per worker once the database is busy

pdb:
  enabled: true
  minAvailable: 1

# Database: the litellm database on RDS. Secret litellm-db comes from astra/rds/litellm.
db:
  useExisting: true
  deployStandalone: false
  database: litellm
  url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
  secret:
    name: litellm-db
    usernameKey: username
    passwordKey: password
    endpointKey: host

# The admin key for the API (teams, keys). From astra/litellm/master-key.
masterkeySecretName: litellm-env
masterkeySecretKey: LITELLM_MASTER_KEY

# LITELLM_SALT_KEY, VLLM_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY.
environmentSecrets:
  - litellm-env

envVars:
  REDIS_HOST: redis.gateway.svc.cluster.local
  REDIS_PORT: "6379"
  PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer.gateway.svc.cluster.local:3000
  PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer.gateway.svc.cluster.local:3000
  LANGFUSE_HOST: http://langfuse-web.langfuse.svc:3000
  # AWS_REGION, BEDROCK_GUARDRAIL_ID and BEDROCK_GUARDRAIL_VERSION are added by argocd/gateway.yaml.

# Migration Job as an Argo CD Sync hook in wave 1, not PreSync:
# a PreSync hook would run before its own service account and database Secret exist.
migrationJob:
  enabled: true
  hooks:
    argocd:
      enabled: false
    helm:
      enabled: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"

# Prometheus metrics on a separate port without key auth (the port is never on the Ingress).
metricsServer:
  enabled: true
  port: 4001
serviceMonitor:
  enabled: true
  interval: 30s

# The public door: https://astra.<domain> on the shared internal ALB. Only /v1 and /health.
# Host and certificate are set in argocd/gateway.yaml.
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: astra-internal
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health/liveliness
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300   # long answers stream for minutes
  hosts:
    - host: astra.example.com   # replaced by argocd/gateway.yaml
      paths:
        - path: /v1
          pathType: Prefix
        - path: /health
          pathType: Prefix

proxy_config:
  model_list:
    # "astra" is the product name apps use. The model behind it can change without any app changing.
    - model_name: astra
      litellm_params:
        model: hosted_vllm/astra
        api_base: http://vllm.serving.svc:8000/v1
        api_key: os.environ/VLLM_API_KEY
        timeout: 300
        # Internal price per token (chargeback): the GPU cost spread over the tokens the teams use.
        # STARTING VALUES, tune them in 7-operate (spend report).
        input_cost_per_token: 0.0000005
        output_cost_per_token: 0.000002
        # weight: 90            # uncomment with the canary entry below
      model_info:
        description: Qwen3.8-27B (FP8) on vLLM, self-hosted on EKS
    # Canary: a second vLLM release ("vllm-canary") with the new model gets a small share of traffic.
    # Uncomment both weights and this entry, then merge. Same model name, so apps change nothing.
    # 7-operate/scripts/canary.sh route makes this same change (weights 90/10, id astra-canary).
    # - model_name: astra
    #   litellm_params:
    #     model: hosted_vllm/astra
    #     api_base: http://vllm-canary.serving.svc:8000/v1
    #     api_key: os.environ/VLLM_API_KEY
    #     timeout: 300
    #     input_cost_per_token: 0.0000005
    #     output_cost_per_token: 0.000002
    #     weight: 10
    #   model_info:
    #     id: astra-canary

  router_settings:
    routing_strategy: simple-shuffle   # honours "weight" for the canary split
    num_retries: 1
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT

  litellm_settings:
    callbacks: ["prometheus"]          # spend and requests per team, scraped by Prometheus
    success_callback: ["langfuse"]     # one trace per request in Langfuse
    failure_callback: ["langfuse"]
    drop_params: true

  # Guardrails run on every request (default_on). Order: Presidio masks PII, then Bedrock checks
  # denied topics and PII on the prompt (pre_call) and on the answer (post_call).
  guardrails:
    - guardrail_name: presidio-pii
      litellm_params:
        guardrail: presidio
        mode: pre_call
        presidio_language: en
        default_on: true
        pii_entities_config:
          CREDIT_CARD: MASK
          EMAIL_ADDRESS: MASK
          PHONE_NUMBER: MASK
          US_SSN: MASK
          IBAN_CODE: MASK
    - guardrail_name: bedrock-input
      litellm_params:
        guardrail: bedrock
        mode: pre_call
        guardrailIdentifier: os.environ/BEDROCK_GUARDRAIL_ID
        guardrailVersion: os.environ/BEDROCK_GUARDRAIL_VERSION
        aws_region_name: os.environ/AWS_REGION
        mask_request_content: true
        default_on: true
    - guardrail_name: bedrock-output
      litellm_params:
        guardrail: bedrock
        mode: post_call
        guardrailIdentifier: os.environ/BEDROCK_GUARDRAIL_ID
        guardrailVersion: os.environ/BEDROCK_GUARDRAIL_VERSION
        aws_region_name: os.environ/AWS_REGION
        mask_response_content: true
        default_on: true

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    database_url: os.environ/DATABASE_URL
