{{- if and .Values.serviceAccount.create (not .Values.canary) }}
# EKS Pod Identity gives this service account S3 read on the models bucket (terraform/foundations/pod-identity.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
{{- end }}
