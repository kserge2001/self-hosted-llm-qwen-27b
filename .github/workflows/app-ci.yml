# CI of the k8s-assistant app (stage 6). The app team owns this file.
# Action versions: latest releases on GitHub, checked 2026-10-28.
name: app-ci

on:
  push:
    branches: [main]
    paths: ["6-app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["6-app/**", ".github/workflows/app-ci.yml"]
  # Run by hand, e.g. promptfoo again after a model upgrade. It builds the image but does not push it.
  workflow_dispatch: {}

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 6-app/k8s-assistant

jobs:
  test:
    runs-on: ubuntu-latest  # GitHub-hosted: lint and unit tests need no cluster
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR with the job's own token, no stored password
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        # Pull requests build the image but do not push it.
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/k8s-assistant
          # sha-<short commit>: the tag you put in deploy/kustomization.yaml. Never "latest".
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@v7.4.0
        with:
          context: 6-app/k8s-assistant
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - run: echo "Image tag ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  promptfoo:
    needs: test
    # Self-hosted runner inside the cluster: the gateway is on an internal load balancer.
    # Pull requests from forks never run here, so outside code cannot reach the cluster.
    # A run by hand is started by someone with write access, so it may use the cluster too.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-runner
    permissions:
      contents: read
    env:
      OPENAI_BASE_URL: https://astra.${{ vars.ASTRA_DOMAIN }}/v1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Read the team key
        # The runner's Pod Identity role may read astra/teams/*. The key never leaves the job.
        run: |
          pip install boto3==1.43.120  # latest on PyPI, checked 2026-10-28
          KEY=$(python -c "import boto3, json; s = boto3.client('secretsmanager', region_name='us-east-1').get_secret_value(SecretId='astra/teams/k8s-assistant'); print(json.loads(s['SecretString'])['api_key'])")
          echo "::add-mask::$KEY"
          echo "OPENAI_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Run promptfoo
        # promptfoo 0.125.1: latest on npm, checked 2026-10-28. --no-cache, so latency is real.
        run: npx --yes promptfoo@0.125.1 eval -c tests/promptfooconfig.yaml --no-cache --no-progress-bar
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
