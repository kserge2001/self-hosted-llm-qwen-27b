# Smoke test of the ARC runners (stage 2): one job on a runner pod inside the cluster.
# Run it by hand after ARC is up: GitHub, Actions, arc-smoke, Run workflow.
# If the last step prints the role astra-arc-runner, EKS Pod Identity works and no AWS keys are needed.
name: arc-smoke

on:
  workflow_dispatch: {}

# The job reads nothing from the repository, so the token needs no access at all.
permissions: {}

jobs:
  smoke:
    runs-on: arc-runner
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-1
      AWS_CLI_VERSION: 2.39.1   # latest AWS CLI v2, checked 2026-10-28
    steps:
      - name: Where the job runs
        run: |
          hostname   # the runner pod name
          uname -a
          whoami
      - name: Install the AWS CLI
        # The ARC runner image (ghcr.io/actions/actions-runner) has no AWS CLI. Install it in the job's
        # temp folder, so nothing changes on the image and no sudo is needed.
        run: |
          command -v unzip >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q unzip; }
          curl -sSfL -o "$RUNNER_TEMP/awscli.zip" \
            "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m)-${AWS_CLI_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/aws/install" -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: AWS identity from Pod Identity
        # The Arn should be ...:assumed-role/astra-arc-runner/... (service account arc-runner).
        run: aws sts get-caller-identity
