# Teams as code: a merged change to 5-gateway/teams/ creates or updates the teams and their keys in LiteLLM.
# Runs on the ARC runners inside the cluster: they reach litellm.gateway.svc directly, and their service
# account (EKS Pod Identity) reads astra/litellm/master-key and writes astra/teams/<team>. No AWS keys in GitHub.
name: gateway-teams

on:
  push:
    branches: [main]
    paths:
      - "5-gateway/teams/**"
      - "5-gateway/scripts/sync_teams.py"
  workflow_dispatch: {}

permissions:
  contents: read

# Two runs at once could both create a key for the same new team.
concurrency:
  group: gateway-teams
  cancel-in-progress: false

jobs:
  sync:
    runs-on: arc-runner
    env:
      AWS_REGION: us-east-1
      LITELLM_URL: http://litellm.gateway.svc:4000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, checked 2026-10-28
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, checked 2026-10-28
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r 5-gateway/scripts/requirements.txt
      # The script reads the master key from Secrets Manager itself and never prints a key.
      - name: Show the changes
        run: python 5-gateway/scripts/sync_teams.py --dry-run
      - name: Apply the changes
        run: python 5-gateway/scripts/sync_teams.py
