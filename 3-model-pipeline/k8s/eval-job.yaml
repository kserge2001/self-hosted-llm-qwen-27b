# The model gate: test one candidate on a GPU before anyone can approve it.
# A template. The workflow fills the ${...} values with envsubst, then runs kubectl apply.
#
# Two containers in one pod:
#   vllm    - a sidecar. It streams the weights from S3 straight into GPU memory (Run:ai Model Streamer),
#             so there is no copy to local disk. It listens on 127.0.0.1 only: nothing else can reach it.
#   lm-eval - starts after vLLM is ready, runs the eval tasks, writes results.json to the MLflow bucket.
# When lm-eval exits, Kubernetes stops the sidecar and the Job is finished.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: model-pipeline
  labels:
    app.kubernetes.io/name: model-eval
    model: ${MODEL_NAME}
spec:
  backoffLimit: 0                    # one GPU run per attempt; rerun the workflow to try again
  activeDeadlineSeconds: 3600        # new GPU node + load + eval is ~25 min; stop a stuck run
  ttlSecondsAfterFinished: 86400     # keep the pod one day so you can read its logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-eval
        model: ${MODEL_NAME}
    spec:
      serviceAccountName: model-eval     # Pod Identity: read models bucket, write mlflow bucket
      restartPolicy: Never
      # Without this, a Service named "vllm" injects VLLM_PORT=tcp://..., and vLLM refuses to start.
      enableServiceLinks: false
      nodeSelector:
        karpenter.sh/nodepool: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        # A native sidecar (restartPolicy: Always): the lm-eval container waits for its startupProbe.
        - name: vllm
          restartPolicy: Always
          # Latest stable, checked 2026-10-28. Serving was proven on v0.31.0; the gate tests on the
          # same version that serves, so change this together with 4-serving.
          image: vllm/vllm-openai:v0.32.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              # memory_limit caps the streamer's CPU buffer (5 GiB), so 31 GB of weights fit in a 28Gi pod.
              exec vllm serve "${MODEL_URI}" \
                --load-format runai_streamer \
                --model-loader-extra-config '{"concurrency": 16, "memory_limit": 5368709120}' \
                --served-model-name astra \
                --host 127.0.0.1 --port 8000 \
                --max-model-len 32768 \
                --gpu-memory-utilization 0.92 \
                --max-num-seqs 128 \
                --language-model-only \
                --reasoning-parser qwen3 \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --default-chat-template-kwargs '{"enable_thinking": false}'
          env:
            - name: AWS_REGION
              value: ${AWS_REGION}
            - name: AWS_DEFAULT_REGION
              value: ${AWS_REGION}
            - name: HF_HUB_OFFLINE
              value: "1"                 # everything comes from S3; never fall back to Hugging Face
          resources:
            requests:
              cpu: "3"
              memory: 24Gi
              nvidia.com/gpu: 1
            limits:
              memory: 28Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          # vLLM listens on 127.0.0.1, and kubelet probes the pod IP, so the probe runs inside the pod.
          startupProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
            periodSeconds: 15
            failureThreshold: 80         # up to 20 minutes to stream the weights and warm up
      containers:
        - name: lm-eval
          image: python:3.12.16-slim     # checked 2026-10-28
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # lm_eval 0.4.13 and boto3 1.43.120: latest on PyPI, checked 2026-10-28. [api] = HTTP model backends.
              pip install --quiet --root-user-action=ignore "lm_eval[api]==0.4.13" "boto3==1.43.120"
              # local-chat-completions: lm-eval's client for any OpenAI-compatible server (vLLM here).
              # Chat endpoints only support generate_until tasks such as gsm8k (no loglikelihood).
              lm-eval run \
                --model local-chat-completions \
                --model_args "model=astra,base_url=http://127.0.0.1:8000/v1/chat/completions,num_concurrent=32,max_retries=3,tokenized_requests=False" \
                --tasks "${EVAL_TASKS}" \
                --num_fewshot "${EVAL_NUM_FEWSHOT}" \
                --limit "${EVAL_LIMIT}" \
                --apply_chat_template \
                --output_path /results
              # lm-eval writes results_<time>.json in a sub-folder; publish it under the contract name.
              python - <<'PY'
              import glob, os, boto3
              from urllib.parse import urlparse
              path = sorted(glob.glob("/results/**/results_*.json", recursive=True))[-1]
              u = urlparse(os.environ["RESULTS_URI"])
              boto3.client("s3").upload_file(path, u.netloc, u.path.lstrip("/"))
              print("results:", os.environ["RESULTS_URI"])
              PY
          env:
            - name: RESULTS_URI
              value: ${RESULTS_URI}
            - name: OPENAI_API_KEY
              value: unused              # local vLLM has no key: it only listens inside this pod
            - name: AWS_REGION
              value: ${AWS_REGION}
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: results
          emptyDir:
            sizeLimit: 1Gi
