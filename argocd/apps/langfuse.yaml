# Langfuse (traces of every gateway request) in namespace "langfuse".
# Argo CD applies this file because it is under argocd/ (the root app reads that folder).
# Needs the ClickHouse operator and cert-manager (argocd/addons), or the chart refuses to render.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: langfuse
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            enable_langfuse: "true"     # turned on by the Terraform variable apps (terraform.tfvars)
  template:
    metadata:
      name: langfuse
    spec:
      project: default
      sources:
        # Official Langfuse chart, latest checked 2026-10-28.
        - repoURL: https://langfuse.github.io/langfuse-k8s
          chart: langfuse
          targetRevision: 2.1.7
          helm:
            releaseName: langfuse     # Service langfuse-web:3000
            valueFiles:
              - $repo/gateway/langfuse/values.yaml
            valuesObject:
              langfuse:
                nextauth:
                  url: 'https://langfuse.{{ .metadata.annotations.domain }}'
                ingress:
                  annotations:
                    alb.ingress.kubernetes.io/certificate-arn: '{{ .metadata.annotations.acm_certificate_arn }}'
                  hosts:
                    - host: 'langfuse.{{ .metadata.annotations.domain }}'
                      paths:
                        - path: /
                          pathType: Prefix
              s3:
                bucket: '{{ .metadata.annotations.langfuse_bucket }}'
                region: '{{ .metadata.annotations.aws_region }}'
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .metadata.annotations.repo_revision }}'
          ref: repo                   # gives $repo to the valueFiles above
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .metadata.annotations.repo_revision }}'
          path: gateway/langfuse/manifests
      destination:
        server: https://kubernetes.default.svc
        namespace: langfuse
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
