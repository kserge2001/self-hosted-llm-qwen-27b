# Monitoring, in three steps:
#   wave 2  monitoring-config      Grafana admin Secret + the Astra dashboard (platform/monitoring)
#   wave 3  kube-prometheus-stack  Prometheus, Grafana, Alertmanager, node and cluster metrics
#   wave 4  dcgm-exporter          GPU metrics (needs the ServiceMonitor CRD from wave 3)
# Sync waves order only what the root app "platform" applies (these ApplicationSets). The Applications
# they generate converge on their own: retry with backoff, plus SkipDryRunOnMissingResource where a CRD
# comes from another app.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_kube_prometheus_stack
              operator: In
              values: ["true"]
  template:
    metadata:
      name: monitoring-config
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.repo_url}}'
        targetRevision: '{{metadata.annotations.repo_revision}}'
        path: platform/monitoring
      destination:
        server: '{{server}}'
        namespace: monitoring
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_kube_prometheus_stack
              operator: In
              values: ["true"]
  template:
    metadata:
      name: kube-prometheus-stack
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: default
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 92.14.1           # latest stable, checked 2026-10-28
        helm:
          releaseName: kube-prometheus-stack
          valuesObject:
            # EKS runs the control plane; Prometheus cannot scrape these.
            kubeControllerManager: {enabled: false}
            kubeScheduler: {enabled: false}
            kubeEtcd: {enabled: false}
            kubeProxy: {enabled: false}
            grafana:
              admin:
                existingSecret: grafana-admin   # made by monitoring-config (random password, ESO generator)
                userKey: admin-user
                passwordKey: admin-password
              grafana.ini:
                server:
                  root_url: 'https://grafana.{{metadata.annotations.domain}}'
              ingress:
                enabled: true
                ingressClassName: alb
                hosts: ['grafana.{{metadata.annotations.domain}}']
                path: /
                pathType: Prefix
                annotations:
                  alb.ingress.kubernetes.io/scheme: internal
                  alb.ingress.kubernetes.io/group.name: astra-internal
                  alb.ingress.kubernetes.io/target-type: ip
                  alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
                  alb.ingress.kubernetes.io/certificate-arn: '{{metadata.annotations.acm_certificate_arn}}'
                  alb.ingress.kubernetes.io/healthcheck-path: /api/health
              sidecar:
                dashboards:
                  enabled: true
                  searchNamespace: ALL      # loads every ConfigMap labelled grafana_dashboard=1
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 512Mi}
            prometheus:
              prometheusSpec:
                # Pick up monitors and rules from every namespace, not only this chart's.
                podMonitorSelectorNilUsesHelmValues: false
                serviceMonitorSelectorNilUsesHelmValues: false
                ruleSelectorNilUsesHelmValues: false
                retention: 7d
                storageSpec:              # 20 GiB EBS disk: metrics survive a pod restart
                  volumeClaimTemplate:
                    spec:
                      storageClassName: gp3   # made by cluster-base (platform/cluster-base)
                      accessModes: ["ReadWriteOnce"]
                      resources:
                        requests:
                          storage: 20Gi
                resources:
                  requests: {cpu: 200m, memory: 1Gi}
                  limits: {memory: 3Gi}
            alertmanager:
              alertmanagerSpec:
                resources:
                  requests: {cpu: 20m, memory: 64Mi}
                  limits: {memory: 128Mi}
            prometheusOperator:
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 256Mi}
            kube-state-metrics:
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
            prometheus-node-exporter:
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits: {memory: 64Mi}
              tolerations:
                - operator: Exists          # also on tainted GPU nodes
      destination:
        server: '{{server}}'
        namespace: monitoring
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]   # the CRDs are too big for client-side apply
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dcgm-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_dcgm_exporter
              operator: In
              values: ["true"]
  template:
    metadata:
      name: dcgm-exporter
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: default
      source:
        repoURL: https://nvidia.github.io/dcgm-exporter/helm-charts
        chart: dcgm-exporter
        targetRevision: 4.8.4             # latest stable, checked 2026-10-28
        helm:
          releaseName: dcgm-exporter
          valuesObject:
            # Image tag stays the chart default 4.6.1-4.8.4-distroless (DCGM 4.6.1, exporter 4.8.4).
            # Only GPU nodes: Karpenter puts this label on every NVIDIA instance.
            nodeSelector:
              karpenter.k8s.aws/instance-gpu-manufacturer: nvidia
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
            serviceMonitor:
              enabled: true
              interval: 15s
              # The chart default is 25s; the operator rejects a timeout longer than the interval.
              scrapeTimeout: 10s
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {memory: 512Mi}
      destination:
        server: '{{server}}'
        namespace: monitoring
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
