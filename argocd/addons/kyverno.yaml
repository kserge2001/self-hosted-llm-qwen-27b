# Kyverno: checks every new pod against the rules in platform/policies.
# Wave 2: the engine. Wave 3: the policies (need the CRDs).
# Sync waves order only what the root app "platform" applies (these ApplicationSets). The Applications
# they generate converge on their own: retry with backoff, plus SkipDryRunOnMissingResource where a CRD
# comes from another app.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_kyverno
              operator: In
              values: ["true"]
  template:
    metadata:
      name: kyverno
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        # Kyverno's large CRDs show as OutOfSync with the default diff, though nothing differs.
        # The API server computes the diff instead (Argo CD server-side diff).
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      source:
        repoURL: https://kyverno.github.io/kyverno
        chart: kyverno
        targetRevision: 3.9.2             # latest stable (Kyverno v1.19.2), checked 2026-10-28
        helm:
          releaseName: kyverno
          valuesObject:
            admissionController:
              replicas: 1                 # lab size; production runs 3
              container:
                resources:
                  requests: {cpu: 100m, memory: 256Mi}
                  limits: {memory: 512Mi}
            backgroundController:
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
            reportsController:
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
            cleanupController:
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]   # Kyverno CRDs are too big for client-side apply
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_kyverno
              operator: In
              values: ["true"]
  template:
    metadata:
      name: kyverno-policies
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.repo_url}}'
        targetRevision: '{{metadata.annotations.repo_revision}}'
        path: platform/policies         # plain YAML, nothing to template
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [SkipDryRunOnMissingResource=true]
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
