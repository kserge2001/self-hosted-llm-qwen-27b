# Argo CD can pull a Helm chart from an OCI registry only if the registry is declared as a Helm
# repository with enableOCI. Public registry: no credentials.
# Wave -2: long before the gateway (argocd/apps/gateway.yaml) pulls the LiteLLM chart from it.
apiVersion: v1
kind: Secret
metadata:
  name: repo-ghcr-berriai
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
stringData:
  name: berriai-charts
  type: helm
  url: ghcr.io/berriai
  enableOCI: "true"
