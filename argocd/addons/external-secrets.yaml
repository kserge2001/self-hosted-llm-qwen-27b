# External Secrets Operator: copies AWS Secrets Manager values into Kubernetes Secrets.
# Wave 0: almost every other add-on reads a secret through it.
# Sync waves order only what the root app "platform" applies (these ApplicationSets). The Applications
# they generate converge on their own: retry with backoff, plus SkipDryRunOnMissingResource where a CRD
# comes from another app.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true   # deleting the ApplicationSet does not delete the add-on
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_external_secrets
              operator: In
              values: ["true"]
  template:
    metadata:
      name: external-secrets
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.14.0            # latest stable, checked 2026-10-28
        helm:
          releaseName: external-secrets
          valuesObject:
            installCRDs: true
            serviceAccount:
              name: external-secrets      # Pod Identity is linked to this name (terraform/foundations/pod-identity.tf)
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {memory: 256Mi}
            webhook:
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 128Mi}
            certController:
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 192Mi}
      destination:
        server: '{{server}}'
        namespace: external-secrets
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
---
# The ClusterSecretStore every ExternalSecret uses. Wave 1: needs the CRDs from wave 0.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_external_secrets
              operator: In
              values: ["true"]
  template:
    metadata:
      name: external-secrets-config
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.repo_url}}'
        targetRevision: '{{metadata.annotations.repo_revision}}'
        path: platform/external-secrets
        helm:
          valuesObject:
            region: '{{metadata.annotations.aws_region}}'
      destination:
        server: '{{server}}'
        namespace: external-secrets
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [SkipDryRunOnMissingResource=true]   # CRDs may still be installing
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
