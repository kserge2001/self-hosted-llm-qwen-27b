apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-assistant
  namespace: k8s-assistant
data:
  # The gateway. argocd/apps/k8s-assistant.yaml replaces example.com with your domain.
  OPENAI_BASE_URL: https://astra.example.com/v1
  ASTRA_MODEL: astra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-assistant
  namespace: k8s-assistant
  labels:
    app.kubernetes.io/name: k8s-assistant
spec:
  replicas: 2  # two, so one pod can restart while the other answers
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-assistant
    spec:
      serviceAccountName: k8s-assistant
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # kustomization.yaml sets the real image and tag.
          image: k8s-assistant
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: k8s-assistant
            - secretRef:
                name: k8s-assistant-gateway-key
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-assistant
  namespace: k8s-assistant
spec:
  selector:
    app.kubernetes.io/name: k8s-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
