# ClickHouse operator (ClickHouse Inc.): runs ClickHouse and Keeper from the ClickHouseCluster
# and KeeperCluster CRDs. The Langfuse chart (stage 5) creates those and refuses to render
# without the CRDs. Namespace clickhouse-operator, as in the Langfuse chart README.
# Wave 3: after cert-manager (wave 2); the operator's webhook certificate comes from it.
# Sync waves order only what the root app "platform" applies (these ApplicationSets). The Applications
# they generate converge on their own: retry with backoff, plus SkipDryRunOnMissingResource where a CRD
# comes from another app.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clickhouse-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_clickhouse_operator
              operator: In
              values: ["true"]
  template:
    metadata:
      name: clickhouse-operator
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: default
      source:
        repoURL: ghcr.io/clickhouse      # OCI registry
        chart: clickhouse-operator-helm
        targetRevision: 0.0.8             # latest release (operator v0.0.8), the one the Langfuse chart README uses, checked 2026-10-28
        helm:
          releaseName: clickhouse-operator
          # Chart defaults are fine: CRDs on (kept on delete), cert-manager self-signed
          # Issuer for the webhook, memory limit 128Mi.
      destination:
        server: '{{server}}'
        namespace: clickhouse-operator
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        # The Issuer and Certificate kinds come from cert-manager, which may still be starting.
        syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
