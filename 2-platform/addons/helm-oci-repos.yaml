# Argo CD can pull a Helm chart from an OCI registry (ghcr.io) only if the registry is declared
# as a Helm repository with enableOCI. Public registry: no credentials.
# Wave -2: before the ApplicationSets that use them (ARC, cert-manager, ClickHouse operator).
apiVersion: v1
kind: Secret
metadata:
  name: repo-ghcr-actions-runner-controller
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
stringData:
  name: actions-runner-controller-charts
  type: helm
  url: ghcr.io/actions/actions-runner-controller-charts
  enableOCI: "true"
---
# cert-manager (jetstack) chart. Needed by the ClickHouse operator, which Langfuse needs.
apiVersion: v1
kind: Secret
metadata:
  name: repo-quay-jetstack-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
stringData:
  name: jetstack-charts
  type: helm
  url: quay.io/jetstack/charts
  enableOCI: "true"
---
# ClickHouse operator chart. Langfuse (stage 5) runs its ClickHouse through this operator.
apiVersion: v1
kind: Secret
metadata:
  name: repo-ghcr-clickhouse
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
stringData:
  name: clickhouse-charts
  type: helm
  url: ghcr.io/clickhouse
  enableOCI: "true"
