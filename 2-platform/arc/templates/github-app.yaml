# GitHub App login for ARC, from Secrets Manager astra/arc/github-app (set by the student).
# Its JSON keys (github_app_id, github_app_installation_id, github_app_private_key)
# are exactly the keys ARC expects, so the whole secret is copied as it is.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: arc-github-app
  dataFrom:
    - extract:
        key: astra/arc/github-app
