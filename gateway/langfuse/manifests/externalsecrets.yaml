# Langfuse credentials, all from one Secrets Manager JSON: astra/langfuse/init
# (keys: salt, encryption_key, nextauth_secret, public_key, secret_key, admin_email, admin_password,
#  postgres_password, clickhouse_password, redis_password).
# Wave -1: they exist before the databases and Langfuse start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-init
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: langfuse-init
    template:
      data:
        salt: "{{ .salt }}"
        encryption-key: "{{ .encryption_key }}"     # 64 hex characters (openssl rand -hex 32)
        nextauth-secret: "{{ .nextauth_secret }}"
        public-key: "{{ .public_key }}"             # pk-lf-...
        secret-key: "{{ .secret_key }}"             # sk-lf-...
        admin-email: "{{ .admin_email }}"
        admin-password: "{{ .admin_password }}"
  dataFrom:
    - extract:
        key: astra/langfuse/init
---
# The shape the bundled Postgres expects (same password for the admin and the langfuse user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-postgresql-auth
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: langfuse-postgresql-auth
    template:
      data:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
        POSTGRES_DB: langfuse
        USERDB_USER: langfuse
        USERDB_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: astra/langfuse/init
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-clickhouse-auth
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: langfuse-clickhouse-auth
  data:
    - secretKey: password
      remoteRef:
        key: astra/langfuse/init
        property: clickhouse_password
---
# One key per Valkey ACL user; the chart's only user is "default".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-redis-auth
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: langfuse-redis-auth
  data:
    - secretKey: default
      remoteRef:
        key: astra/langfuse/init
        property: redis_password
