# Langfuse: official chart langfuse/langfuse 2.1.7 from https://langfuse.github.io/langfuse-k8s
# (latest, checked 2026-10-28). Image 4.71.0 is the newest Langfuse release that day.
# Traces of every gateway request. Postgres, ClickHouse and Redis (Valkey) run in the cluster for the lab;
# events and media go to the S3 bucket astra-langfuse-<account> through EKS Pod Identity (no access keys).
# Needs the ClickHouse operator and cert-manager (chart prerequisites): argocd/addons
# clickhouse-operator.yaml and cert-manager.yaml (labels enable_clickhouse_operator, enable_cert_manager).
# Domain, bucket and region come from argocd/langfuse.yaml.
#
# Argo CD renders with "helm template", where the chart cannot read back generated passwords,
# so every credential is pinned to a Secret made by External Secrets from astra/langfuse/init.

langfuse:
  image:
    tag: "4.71.0"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: langfuse        # EKS Pod Identity: read/write on the langfuse bucket

  salt:
    secretKeyRef: {name: langfuse-init, key: salt}
  encryptionKey:
    secretKeyRef: {name: langfuse-init, key: encryption-key}
  nextauth:
    url: https://langfuse.example.com          # replaced by argocd/langfuse.yaml
    secret:
      secretKeyRef: {name: langfuse-init, key: nextauth-secret}

  features:
    telemetryEnabled: false
    signUpDisabled: true  # people log in with the admin user below; no self sign-up

  # Headless setup: the first start creates the org, the project with the gateway's API keys,
  # and the admin user, so nothing is clicked in the UI.
  additionalEnv:
    - name: LANGFUSE_INIT_ORG_ID
      value: astra
    - name: LANGFUSE_INIT_ORG_NAME
      value: Astra
    - name: LANGFUSE_INIT_PROJECT_ID
      value: astra-gateway
    - name: LANGFUSE_INIT_PROJECT_NAME
      value: astra-gateway
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom: {secretKeyRef: {name: langfuse-init, key: public-key}}
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom: {secretKeyRef: {name: langfuse-init, key: secret-key}}
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom: {secretKeyRef: {name: langfuse-init, key: admin-email}}
    - name: LANGFUSE_INIT_USER_NAME
      value: admin
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom: {secretKeyRef: {name: langfuse-init, key: admin-password}}

  web:
    service:
      port: 3000          # Service langfuse-web:3000, the address the gateway sends traces to

  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/group.name: astra-internal
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/healthcheck-path: /api/public/health
    hosts:
      - host: langfuse.example.com             # replaced by argocd/langfuse.yaml
        paths:
          - path: /
            pathType: Prefix

postgresql:
  deploy: true
  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-postgresql-auth
    secretKeys:
      userPasswordKey: USERDB_PASSWORD
      adminPasswordKey: POSTGRES_PASSWORD

redis:
  deploy: true
  auth:
    existingSecret: langfuse-redis-auth
    existingSecretPasswordKey: default

clickhouse:
  deploy: true
  auth:
    existingSecret: langfuse-clickhouse-auth
    existingSecretKey: password
  cluster:
    storage:
      size: 20Gi          # the chart default 100Gi is far more than a lab writes
  keeper:
    replicas: 1           # one keeper is enough for one ClickHouse replica in the lab

s3:
  deploy: false           # AWS S3, not the bundled SeaweedFS
  storageProvider: s3
  bucket: astra-langfuse-ACCOUNT          # replaced by argocd/langfuse.yaml
  region: us-east-1
  forcePathStyle: false
  eventUpload:
    prefix: events/
  batchExport:
    prefix: exports/
  mediaUpload:
    prefix: media/
