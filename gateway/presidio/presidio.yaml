# Presidio finds personal data (names, emails, card numbers) and masks it before the prompt reaches the model.
# LiteLLM calls the analyzer, then the anonymizer. Images from Microsoft's registry.
# 2.2.362 is the newest tag on mcr.microsoft.com, checked 2026-10-28 (GitHub shows 2.2.366, not yet published as an image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
  namespace: gateway
  labels:
    app.kubernetes.io/name: presidio-analyzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: presidio-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presidio-analyzer
    spec:
      containers:
        - name: analyzer
          image: mcr.microsoft.com/presidio-analyzer:2.2.362
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20       # the spaCy language model loads at start
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi                 # the spaCy model needs about 1 GiB
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
  namespace: gateway
spec:
  selector:
    app.kubernetes.io/name: presidio-analyzer
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-anonymizer
  namespace: gateway
  labels:
    app.kubernetes.io/name: presidio-anonymizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: presidio-anonymizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presidio-anonymizer
    spec:
      containers:
        - name: anonymizer
          image: mcr.microsoft.com/presidio-anonymizer:2.2.362
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-anonymizer
  namespace: gateway
spec:
  selector:
    app.kubernetes.io/name: presidio-anonymizer
  ports:
    - name: http
      port: 3000
      targetPort: http
